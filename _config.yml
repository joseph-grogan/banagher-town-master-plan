title: Banagher Town Masterplan
description: >-
  Where History Meets Community, and Community Creates the Future.
  Projects, status, and how to get involved.
baseurl: "/banagher-town-master-plan"
url: ""

markdown: kramdown
theme: null
permalink: /projects/:slug/

collections:
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - docs/
  - README.md
  - Gemfile.lock
  - "*.pdf"
  - "*.pdf:*"
